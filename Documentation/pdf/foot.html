</script>
<script>
(async function () {
  const md = document.getElementById('mdsrc').textContent;
  marked.use({ mangle: false });
  document.getElementById('content').innerHTML = marked.parse(md);

  // ```mermaid fences -> rendered diagrams
  document.querySelectorAll('code.language-mermaid').forEach(code => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    code.closest('pre').replaceWith(div);
  });

  // ```wavedrom fences -> rendered timing diagrams
  let wdIdx = 0;
  document.querySelectorAll('code.language-wavedrom').forEach(code => {
    const holder = document.createElement('div');
    holder.className = 'wavedrom-holder';
    const inner = document.createElement('div');
    inner.id = 'WaveDrom_Display_' + wdIdx;
    holder.appendChild(inner);
    const srcText = code.textContent;
    code.closest('pre').replaceWith(holder);
    try {
      const src = eval('(' + srcText + ')');   // wavedrom JSON is relaxed (unquoted keys)
      const render = WaveDrom.renderWaveForm || WaveDrom.RenderWaveForm;
      render(wdIdx, src, 'WaveDrom_Display_');
    } catch (e) { inner.textContent = 'WaveDrom error: ' + e; }
    wdIdx++;
  });

  mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
  await mermaid.run({ querySelector: '.mermaid' });
  document.title = 'RENDER_DONE';
})();
</script>
</body>
</html>
