<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown-light.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/wavedrom@3.5.0/wavedrom.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/wavedrom@3.5.0/skins/default.js"></script>
<style>
  body { margin: 0; }
  .markdown-body { box-sizing: border-box; margin: 0 auto; padding: 8px 0; font-size: 13px; }
  .markdown-body pre { font-size: 11.5px; }
  /* github-markdown-css sets table display:block — breaks full-width banner tables */
  .markdown-body table { display: table; width: 100%; }
  .markdown-body td, .markdown-body th { word-break: normal; }
  /* per-page banner tables carry their own inline border:none — don't re-border them */
  .markdown-body table[style*="border:none"] td { border: none; }
  .mermaid { text-align: center; }
  .mermaid svg { max-width: 100%; height: auto; }
  .wavedrom-holder { text-align: center; overflow: hidden; }
  .wavedrom-holder svg { max-width: 100%; height: auto; }
  .markdown-body img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
  @page { size: letter; margin: 14mm 12mm; /*PAGEHDR*/ }
  @media print {
    pre, blockquote, img, .mermaid, .wavedrom-holder { page-break-inside: avoid; }
    /* let long tables split across pages — a whole-table avoid strands near-blank pages */
    table { page-break-inside: auto; }
    tr { page-break-inside: avoid; }
    thead { display: table-header-group; }
  }
</style>
</head>
<body>
<div id="content" class="markdown-body"></div>
<script type="text/markdown" id="mdsrc">
